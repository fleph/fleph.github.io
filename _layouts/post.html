---
layout: default
---

<header>
  <h1 class="page__title">{{ page.title }}</h1>
  {% if page.date %}
    <p class="page__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    </p>
  {% endif %}
</header>

{{ content }}

<p><a href="{{ '/blog/' | relative_url }}">Back to Blog</a></p>
